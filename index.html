<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#e8f4fb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Avara Ashiq - Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

  <!-- Preloader -->
  <div id="preloader">
    <div class="bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <p class="preloader-text">Avara Ashiq</p>
  </div>

  <div id="app">

    <!-- YouTube Player -->
    <div id="yt-player" style="position:absolute;width:1px;height:1px;top:-1px;left:-1px;pointer-events:none;"></div>

    <!-- ===== HOME VIEW ===== -->
    <div id="home-view" class="view active-view">
      <div class="home-scroll">
        <!-- Header -->
        <div class="home-header">
          <h1 class="playlist-heading">Playlist</h1>
          <button id="mix-btn" class="mix-btn">mix</button>
        </div>
        <!-- Song List -->
        <div id="song-list"></div>

        <!-- Compilation Section -->
        <div class="compilation-section">
          <h2 class="compilation-heading">Compilation</h2>
          <div id="compilation-card" class="compilation-card"></div>
        </div>
      </div>

      <!-- Mini Player -->
      <div id="mini-player" class="mini-player hidden">
        <img id="mini-art" class="mini-art" src="" alt="art">
        <div class="mini-info">
          <div id="mini-title" class="mini-title"></div>
          <div id="mini-artist" class="mini-artist"></div>
        </div>
        <div class="mini-controls">
          <button id="mini-prev" aria-label="Prev">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button id="mini-play" class="mini-play-btn" aria-label="Play/Pause">
            <svg id="mini-play-icon"  viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="mini-pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button id="mini-next" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>
        <!-- Mini Progress -->
        <div class="mini-progress-bar">
          <div id="mini-progress-fill" class="mini-progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- ===== PLAYER VIEW ===== -->
    <div id="player-view" class="view hidden-view">

      <!-- Back + title -->
      <div class="player-top-bar">
        <button id="back-btn" class="back-btn" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <div class="player-top-center">
          <div id="player-song-title" class="player-song-title">Song Name</div>
          <div id="player-artist" class="player-artist">Artist</div>
        </div>
        <div style="width:40px"></div>
      </div>

      <!-- Circle Art -->
      <div class="circle-art-wrapper">
        <div class="circle-art-bg">
          <img id="player-art" class="circle-art-img" src="" alt="art">
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-area">
        <div id="progress-track" class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="progress-times">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <!-- Controls Row -->
      <div class="controls-row">
        <button id="shuffle-btn" class="ctrl-icon-btn shuffle-btn" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button id="prev-btn" class="ctrl-icon-btn" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16z"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
        <button id="play-pause-btn" class="play-pause-btn" aria-label="Play/Pause">
          <svg id="play-icon"  viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="next-btn" class="ctrl-icon-btn" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4z"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
        <button id="repeat-btn" class="ctrl-icon-btn repeat-btn" aria-label="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <!-- Action Row -->
      <div class="action-row">
        <button class="action-btn" aria-label="Download">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Download</span>
        </button>
        <button class="action-btn volume-btn" aria-label="Volume">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
        <button id="like-btn" class="action-btn like-btn" aria-label="Like">
          <svg id="like-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>

    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button id="nav-home" class="nav-btn active" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button id="nav-search" class="nav-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search</span>
      </button>
      <button id="nav-heart" class="nav-btn" aria-label="Liked">
        <svg id="nav-heart-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>Liked</span>
      </button>
    </nav>

  </div>

  <!-- CRITICAL: preloader removal - pure inline, no dependencies -->
  <script>
    !function(){
      var done=false;
      function go(){
        if(done)return; done=true;
        var el=document.getElementById('preloader');
        if(!el)return;
        el.style.transition='opacity 0.4s';
        el.style.opacity='0';
        setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},400);
      }
      setTimeout(go,2500);
      window.addEventListener('load',function(){setTimeout(go,700);});
    }();
  </script>

  <!-- CRITICAL: global YouTube callback MUST be set before loading YouTube API -->
  <script>
    window._ytReady = false;
    window._ytReadyCallbacks = [];
    window.onYouTubeIframeAPIReady = function() {
      window._ytReady = true;
      window._ytReadyCallbacks.forEach(function(cb){ cb(); });
    };
  </script>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- App (module, runs after DOM ready) -->
  <script type="module" src="/src/main.js"></script>

</body>
</html>
