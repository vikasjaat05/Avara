<!doctype html>
<html lang="hi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AVARA" />

  <title>Favorite Music Player</title>

  <!-- Google Fonts for Clean Minimalist Look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <div id="app">
    <!-- Hidden YouTube Audio Player Container -->
    <div id="yt-player-wrapper" style="display: none;">
      <div id="youtube-player"></div>
    </div>

    <!-- Main Container -->
    <div class="app-container">
      
      <!-- Left Sidebar (Dark Grey Curved) -->
      <aside class="sidebar">
        <div class="music-icon-bubble">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18V5L21 3V16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <circle cx="6" cy="18" r="3" fill="#ffffff"/>
            <circle cx="18" cy="16" r="3" fill="#ffffff"/>
          </svg>
        </div>
      </aside>

      <!-- Main White Content Area -->
      <main class="main-content">
        
        <!-- Header -->
        <header class="top-header">
          <h1 class="header-title">Favorite music</h1>
          <button class="menu-btn" title="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="10" y1="8" x2="21" y2="8"></line>
              <line x1="4" y1="16" x2="21" y2="16"></line>
            </svg>
          </button>
        </header>

        <!-- Hero: Album Art -->
        <section class="hero-section">
          <div class="album-art-container">
            <div class="vinyl-record">
              <div class="vinyl-inner"></div>
              <div class="vinyl-center"></div>
            </div>
            <img id="player-album-art" src="https://img.youtube.com/vi/xAHS7PhfI6Q/hqdefault.jpg" alt="Album Cover" class="album-cover-img" />
          </div>
        </section>

        <!-- Track Info -->
        <section class="track-info">
          <h2 id="player-song-title" class="track-title">Tujhe Bhoolna To Chaha</h2>
          <p id="player-artist" class="track-artist">Sonu Nigam - Bewafa Sanam</p>
        </section>

        <!-- Seekbar Area -->
        <section class="seekbar-section">
          <div class="wave-container">
            <!-- Simulated Wave SVG -->
            <svg class="wave-svg" viewBox="0 0 300 40" preserveAspectRatio="none">
              <!-- Background wave path -->
              <path id="wave-bg-path" class="wave-bg" d="M0,20 C50,40 100,40 150,20 C200,0 250,0 300,20" fill="none" stroke="#d1d5db" stroke-width="3" stroke-linecap="round"></path>
              <!-- Progress wave path (clipped by JS or overlaid) -->
              <path id="wave-progress" class="wave-fill" d="M0,20 C50,40 100,40 150,20 C200,0 250,0 300,20" fill="none" stroke="#475b75" stroke-width="3" stroke-linecap="round" stroke-dasharray="320" stroke-dashoffset="320"></path>
            </svg>
            
            <!-- Hidden native range input for functional scrubbing -->
            <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1" class="native-range" />
            
            <!-- Custom dot matching the screenshot -->
            <div id="progress-dot" class="progress-dot"></div>
          </div>
          <div class="time-labels">
            <span id="current-time">00:00</span>
            <span id="total-time">00:00</span>
          </div>
        </section>

        <!-- Playback Controls -->
        <section class="controls-container">
          <button id="repeat-btn" class="ctrl-btn sm-btn" title="Repeat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475b75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
          </button>
          
          <button id="prev-btn" class="ctrl-btn" title="Previous">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#475b75">
              <path d="M19 20L9 12l10-8v16zM5 19h2V5H5v14z" />
            </svg>
          </button>
          
          <button id="play-pause-btn" class="play-btn" title="Play">
            <svg id="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="#ffffff" style="margin-left: 4px;">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg id="pause-icon" width="28" height="28" viewBox="0 0 24 24" fill="#ffffff" class="hidden">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
          
          <button id="next-btn" class="ctrl-btn" title="Next">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#475b75">
              <path d="M5 4l10 8-10 8V4zm14 1v14h-2V5h2z" />
            </svg>
          </button>
          
          <button id="eq-btn" class="ctrl-btn sm-btn" title="Equalizer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#475b75">
              <rect x="4" y="10" width="4" height="10" rx="2" />
              <rect x="10" y="4" width="4" height="16" rx="2" />
              <rect x="16" y="14" width="4" height="6" rx="2" />
            </svg>
          </button>
        </section>

      </main>
    </div>
  </div>

  <!-- Main Module Script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
