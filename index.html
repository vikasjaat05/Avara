<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0B0E14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Avara — Sound of Emotion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" src="/src/main.js"></script>
</head>
<body>

  <!-- ═══════════ CREATIVE PRELOADER ═══════════ -->
  <div id="preloader">
    <div class="pre-vinyl">
      <div class="pre-vinyl-groove"></div>
      <div class="pre-vinyl-groove"></div>
      <div class="pre-vinyl-groove"></div>
      <div class="pre-vinyl-center">
        <div class="pre-vinyl-hole"></div>
      </div>
      <div class="pre-needle"></div>
    </div>
    <div class="pre-bars">
      <div class="pre-bar"></div>
      <div class="pre-bar"></div>
      <div class="pre-bar"></div>
      <div class="pre-bar"></div>
      <div class="pre-bar"></div>
    </div>
    <p class="pre-title">AVARA</p>
    <p class="pre-sub">Crafting your musical experience…</p>
  </div>

  <!-- ═══════════ APP SHELL ═══════════ -->
  <div id="app">

    <!-- YouTube player: off-screen -->
    <div id="yt-player" style="position:fixed;left:-600px;top:-600px;width:320px;height:180px;z-index:-999;"></div>

    <!-- ══════════ DESKTOP SIDEBAR ══════════ -->
    <aside class="desktop-sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <span class="logo-text">AVARA</span>
      </div>

      <nav class="sidebar-nav">
        <button id="sd-discover" class="sd-nav-btn active">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L4 9v12h16V9l-8-6zm0 14.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          <span>Home</span>
        </button>
        <button id="sd-search" class="sd-nav-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>Search</span>
        </button>
        <button id="sd-library" class="sd-nav-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <span>Library</span>
        </button>
        <button id="sd-liked" class="sd-nav-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          <span>Liked Songs</span>
        </button>
      </nav>

      <!-- Desktop Sidebar Player Panel -->
      <div id="sd-player-panel" class="sd-player-panel hidden">
        <div class="sd-art-wrap">
          <img id="sd-art" class="sd-art" src="" alt="art">
          <div id="sd-art-blur" class="sd-art-blur"></div>
        </div>
        <div id="sd-title" class="sd-title">—</div>
        <div id="sd-artist" class="sd-artist">—</div>
        <div class="sd-progress-wrap">
          <div id="sd-progress-track" class="sd-progress-track">
            <div id="sd-progress-fill" class="sd-progress-fill"></div>
          </div>
          <div class="sd-times">
            <span id="sd-cur">0:00</span>
            <span id="sd-rem">-0:00</span>
          </div>
        </div>
        <div class="sd-controls">
          <button id="sd-prev" class="sd-ctrl-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16z"/><rect x="5" y="5" width="2" height="14" rx="1"/></svg>
          </button>
          <button id="sd-play" class="sd-play-btn">
            <svg id="sd-play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="sd-pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button id="sd-next" class="sd-ctrl-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4z"/><rect x="17" y="5" width="2" height="14" rx="1"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- ══════════ MAIN CONTENT AREA ══════════ -->
    <main class="main-content">

      <!-- ─── HOME VIEW ─── -->
      <div id="home-view" class="view active-view">
        <div class="home-scroll">

          <!-- Avara Header -->
          <div class="avara-header">
            <div class="brand-badge">
              <div class="brand-dot"></div>
              <span class="brand-title">AVARA MUSIC</span>
            </div>
            <div class="header-actions">
              <button id="search-toggle-btn" class="icon-circle-btn" aria-label="Search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </button>
            </div>
          </div>

          <!-- Search bar (Collapsible) -->
          <div id="search-bar" class="search-bar hidden">
            <svg class="search-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="search-input" type="text" placeholder="Search songs, artists, or lyrics…" autocomplete="off">
            <button id="search-close">✕</button>
          </div>

          <!-- Hero Spotlight Banner (Dynamic Real Song Feature) -->
          <section class="hero-banner-section">
            <div id="hero-banner" class="hero-banner">
              <div id="hero-bg" class="hero-bg"></div>
              <div class="hero-overlay"></div>
              <div class="hero-content">
                <span class="hero-tag">🔥 FEATURED SOUNDTRACK</span>
                <h1 id="hero-title" class="hero-title">Tujhe Bhoolna To Chaha</h1>
                <p id="hero-artist" class="hero-artist">Sonu Nigam / Nikhil-Vinay</p>
                <div class="hero-btn-row">
                  <button id="hero-play-btn" class="hero-play-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M8 5v14l11-7z"/></svg>
                    <span>Play Soundtrack</span>
                  </button>
                </div>
              </div>
            </div>
          </section>

          <!-- Category Chips Bar -->
          <div class="category-chips-bar">
            <button class="cat-chip active" data-filter="all">All Tracks</button>
            <button class="cat-chip" data-filter="💔 बेवफाई">💔 बेवफाई</button>
            <button class="cat-chip" data-filter="🔥 अत्यधिक दर्द">🔥 अत्यधिक दर्द</button>
            <button class="cat-chip" data-filter="🌌 यादें">🌌 यादें</button>
          </div>

          <!-- Quick Songs Grid (Real Songs from AVARA_SONGS) -->
          <section class="quick-grid-section">
            <h2 class="section-title">Quick Picks</h2>
            <div id="quick-grid" class="quick-grid"></div>
          </section>

          <!-- Shelf 1: 💔 बेवफाई -->
          <section class="shelf-section">
            <div class="shelf-header">
              <h2 class="shelf-title">💔 दर्द-ए-दिल Collection</h2>
            </div>
            <div id="shelf-bewafai" class="shelf-scroll"></div>
          </section>

          <!-- Shelf 2: 🔥 अत्यधिक दर्द -->
          <section class="shelf-section">
            <div class="shelf-header">
              <h2 class="shelf-title">🔥 Deep Emotion Hits</h2>
            </div>
            <div id="shelf-dard" class="shelf-scroll"></div>
          </section>

          <!-- Shelf 3: All Songs List -->
          <section class="tracks-section">
            <h2 class="section-title">All Songs</h2>
            <div id="song-list"></div>
          </section>

        </div>

        <!-- Floating Mobile Mini Player (Avara Velvet Crimson Glass) -->
        <div id="mini-player" class="mini-player hidden">
          <div class="mini-left" id="mini-open">
            <img id="mini-art" class="mini-art" src="" alt="art">
            <div class="mini-info">
              <div id="mini-title" class="mini-title">Select a Song</div>
              <div id="mini-artist" class="mini-artist-txt">Avara Music</div>
            </div>
          </div>
          <div class="mini-right">
            <button id="mini-play-btn" class="mini-play-btn">
              <svg id="mini-play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg id="mini-pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
          </div>
          <div class="mini-prog-bar">
            <div id="mini-prog-fill" class="mini-prog-fill"></div>
          </div>
        </div>
      </div>

      <!-- ─── PLAYER VIEW (Full Glass Overlay) ─── -->
      <div id="player-view" class="view hidden-view">
        <div id="player-bg" class="player-bg"></div>

        <div class="player-scroll">
          <div class="player-topbar">
            <button id="back-btn" class="player-back-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <span class="player-topbar-label">NOW PLAYING</span>
            <button id="player-like-btn" class="player-like-btn">
              <svg id="player-like-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
          </div>

          <div class="player-art-wrap">
            <img id="player-art" class="player-art" src="" alt="art">
          </div>

          <div class="player-info">
            <div>
              <div id="player-title" class="player-title">—</div>
              <div id="player-artist" class="player-artist">—</div>
            </div>
          </div>

          <div class="lyrics-strip">
            <div id="lyrics-line" class="lyrics-line">♪ &nbsp; Avara Soundscape &nbsp; ♪</div>
          </div>

          <div class="progress-area">
            <div id="progress-track" class="progress-track">
              <div id="progress-fill" class="progress-fill"></div>
              <div id="progress-thumb" class="progress-thumb"></div>
            </div>
            <div class="progress-times">
              <span id="time-cur">0:00</span>
              <span id="time-rem">-0:00</span>
            </div>
          </div>

          <div class="player-controls">
            <button id="shuffle-btn" class="ctrl-sm-btn" aria-label="Shuffle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            </button>
            <button id="prev-btn" class="ctrl-sm-btn" aria-label="Prev">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16z"/><rect x="5" y="5" width="2" height="14" rx="1"/></svg>
            </button>
            <button id="play-pause-btn" class="play-btn" aria-label="Play/Pause">
              <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button id="next-btn" class="ctrl-sm-btn" aria-label="Next">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4z"/><rect x="17" y="5" width="2" height="14" rx="1"/></svg>
            </button>
            <button id="repeat-btn" class="ctrl-sm-btn" aria-label="Repeat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            </button>
          </div>

          <div class="volume-row">
            <svg class="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>
            <input id="vol-slider" class="vol-slider" type="range" min="0" max="100" value="80">
            <svg class="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </div>
        </div>
      </div>

    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
      <button id="nav-home" class="mob-nav-btn active">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L4 9v12h16V9l-8-6zm0 14.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        <span>Home</span>
      </button>
      <button id="nav-search-mob" class="mob-nav-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search</span>
      </button>
      <button id="nav-music-mob" class="mob-nav-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>Library</span>
      </button>
      <button id="nav-liked-mob" class="mob-nav-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span>Liked</span>
      </button>
    </nav>

  </div>

  <!-- Preloader script -->
  <script>
    !function(){
      var done=false;
      function hide(){
        if(done)return;done=true;
        var el=document.getElementById('preloader');
        if(!el)return;
        el.style.transition='opacity 0.5s ease';
        el.style.opacity='0';
        setTimeout(function(){el&&el.parentNode&&el.parentNode.removeChild(el);},550);
      }
      setTimeout(hide, 1600);
      window.addEventListener('load',function(){setTimeout(hide, 500);});
    }();
  </script>

  <!-- YouTube API setup -->
  <script>
    window._ytReady = false;
    window._ytCbs   = [];
    window.onYouTubeIframeAPIReady = function() {
      window._ytReady = true;
      var cbs = window._ytCbs.slice(); window._ytCbs = [];
      cbs.forEach(function(f){ f(); });
    };
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
